<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

    </style>
</head>

<body>

    <section>
        <div>
            <label>
                텍스트 입력:
                <input type="text" id="input-txt">
            </label>
        </div>
        <div>
            <label>
                사이즈 입력:
                <input type="text" id="input-size">
            </label>
        </div>
        <div>
            <label>
                색상 입력:
                <input type="text" id="input-color">
            </label>
        </div>

        <div>
            <button onClick="generateText()">생성</button>
        </div>

        <div>
            <p id="result"></p>
        </div>
    </section>

    <script>

        function generateText(){
            const resultTag = document.querySelector("#result");
            const text = document.querySelector("#input-txt").value;
            const size = document.querySelector("#input-size").value;
            const color = document.querySelector("#input-color").value;

            resultTag.innerHTML = `<span style="color:${color}; font-size:${size}px">${text}</span>`;
            
        }

    </script>

</body>

</html>
