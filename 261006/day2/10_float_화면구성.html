<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container {
            width: 1000px;
            margin: 20px auto;
        }


        #header {
            width: 100%;
            height: 150px;
            background-color: beige;
            padding: 30px;
            border: 1px solid black;
            padding: 30px;
            box-sizing: border-box;
        }

        #sidebar {
            width: 300px;
            height: 500px;
            background-color: antiquewhite;
            float: left;
            border: 2px solid black;
            padding: 30px;
            box-sizing: border-box;
            /* border + padding + margin 합쳐서 크기 값에 맞춰준다 */
        }

        #contents {
            width: 700px;
            height: 500px;
            background-color: azure;
            float: left;
            border: 1px solid black;
            padding: 30px;
            box-sizing: border-box;
        }

        #footer {
            width: 100%;
            height: 150px;
            background-color: aliceblue;
            clear: both;
            border: 1px solid black;
            padding: 30px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <div id="container">
        <div id="header">
            <h1>헤더 영역~ 검색어 같은 기능 넣기 ~~~</h1>
        </div>
        <div id="sidebar">
            <h1>사이드 영역. 로그인이날 날씨 위젯 등 넣기</h2>
        </div>
        <div id="contents">
            <h1>메인 컨텐츠 영역</h2>
        </div>
        <div id="footer">
            <h1>푸터 영역</h2>
        </div>
    </div>

</body>

</html>
