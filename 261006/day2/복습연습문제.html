<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .wrapper {
            width: 43%;
            margin: 0 auto;
        }

        p {
            margin: 0;
        }

        .header-cont {
            background-color: rgba(48, 226, 48, 0.753);
            color: #fff;
            text-align: center;
            padding: 10px 0;
        }

        .header-cont * {
            margin: 0;
        }

        .section {
            box-shadow: -5px -17px 18px #eee;
            border: 1px solid #eee;
            border-radius: 1%;
            margin-top: 10px;
            padding: 20px 20px 35px 20px;
        }

        .section .p {
            font-weight: bold;
            margin: 0;
        }

        .blue {
            color: blue;
        }

        .red {
            color: red;
        }

        .div2 {
            margin-top: 10px;
        }

        .div2 table,
        .div2 tr,
        .div2 td {
            border: 1px solid #ccc;
            border-collapse: collapse;
            padding:10px 20px;
        }

        .div2 .header {
            background-color: #eee;
            width: 200px;
            text-align: center;
        }

        .div3 {
            margin-top: 10px;
        }

        .div4 {
            text-align: center;
            margin-top:100px;
        }
        
        .img{ width:400px;}
    </style>
</head>

<body>

    <div class="wrapper">

        <div class="header-cont">
            <h1>자바 수강생 모집</h1>
            <p>자바에 관심 있는 새내기 여러분을 모집합니다.</p>
        </div>

        <section class="section">
            <div class="div1">

                <p class="p">
                    교내 프로그래밍 동아리에서 <strong class="blue">신입생</strong>을 대상으로 자바 수강생을 모집합니다.
                </p>
                <p class="p">
                    <strong class="red"">
                        학부나 전공에 상관없습니다.
                    </strong>
                </p>
                <p class=" p">평소 방송에 관심있었던 여러 학우들의 지원바랍니다.
                </p>
            </div>

            <div class="div2">

                <table class="table">
                    <tbody>
                        <tr>
                            <td class="header">
                                모집기간
                            </td>
                            <td>
                                2월 5일 ~ 2월 11일
                            </td>
                        </tr>
                        <tr>
                            <td class="header">
                                모집분야
                            </td>
                            <td>
                                자바 기초, 자바 심화, 백엔드 입문
                            </td>
                        </tr>
                        <tr>
                            <td class="header">
                                지원방법
                            </td>
                            <td>
                                <p>
                                    양식 작성 후 이메일 접수
                                </p>
                                <p>
                                    <i>
                                        지원서 양식은 교내 동아리 홈페이지 공지 게시판에 있습니다.
                                    </i>
                                </p>

                            </td>
                        </tr>
                    </tbody>
                </table>
            </div><!-- div1 -->

            <div class="div3">
                <p>
                    <strong>
                        혜택
                    </strong>
                </p>
                <ul>
                    <li>아주 작은 소정의 활동비 지급</li>
                    <li>주기적인 회식</li>
                </ul>
            </div>

            <div class="div4">
                <img class="img" src="../images/java_img.jpg" alt="자바 책 이미지" />
            </div>

        </section>
    </div>

</body>

</html>
