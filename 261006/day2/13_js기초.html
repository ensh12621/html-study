<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    

    <button onClick="fnAlert()">
        alert 버튼
    </button>

    <button onclick="fnConfirm()">
        confirm 버튼
    </button>

    <button onclick="fnPrompt()">
        prompt 버튼
    </button>

<script>

// 변수
// 자바처럼 변수 선언 시 정수, 실수, 불린 등을 구분안해도 된다.
// let, var, const

let a = 30;
let b = 30.5;
let c = true;
let d = "hello";
let e = [1,3,5,7,9];
let f = {
    name: "홍길동",
    age: 30
};

let g = new Date();
let h = function(){
    alert('로스트아크');
}

function fnAlert(){
    // alert => 알림창. '확인' 버튼 1개밖에 없음
    alert('로스트아크 짱짱맨');
}
function fnConfirm(){
    if(confirm("로스트아크가 재미 있다는 것에 동의하십니까?")){
        alert("재밌죠? 그쵸?");
    }else{
        alert("레이드 함 맛 봐봐. 재밌어");
    }
}
function fnPrompt(){
    // 잘 안씀. 참고로만 알아두셈
    // 값을 입력받을 수 있는 창
    const name = prompt("이름을 입력하세요.");
    alert(name + "님 같이 로스트아크 하시죠");
}

// console.log("안녕? 로스트아크");

let name = "홍길동";

if(name == "홍길동"){
    console.log('참');
}else{
    console.log('거짓');
}

let num = "10";

if(num == 10){
    console.log("2번 참");
}else{
    console.log("2번 거짓");
}

if(num === 10){
    console.log("3번 참");
}else{
    console.log("3번 거짓");
}

// '='이 두 개 짜리는 타입 상관없이 값만 같다면 true를 리턴
// '='이 세 개 짜리는 값과 타입 모두 비교하여 둘 다 같아야 true를 리턴

</script>

</body>
</html>
