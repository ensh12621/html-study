<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        table,
        tr,
        td,
        th {
            border: 1px solid black;
            padding: 5px 10px;
            border-collapse: collapse;
        }
    </style>
</head>

<body>
    <div id="app">
        <!-- html. 반드시 id가 app인 태그 안에서 작업 -->
        <!-- (script 맨 하단 app.mount('#app'); 여기 아이디와 같아야 함) -->

        <div>
            <label>
                학번:
                <input type="text" v-model="stuNo">
            </label>
        </div>

        <div>
            <label>
                이름:
                <input type="text" v-model="stuName">
            </label>
        </div>
        <div>
            학과:
            <select name="" v-model="stuDept" id="">
                <option value="">:: 선택 ::</option>
                <option value="1">기계</option>
                <option value="2">전기전자</option>
                <option value="3">컴퓨터정보</option>
            </select>
        </div>
        <div>
            성별:
            <label>
                <input type="radio" name="gender" v-model="stuGender" value="m">
                남자
            </label>
            <label>
                <input type="radio" name="gender" v-model="stuGender" value="f">
                여자
            </label>
        </div>
        <div>
            <button @click="submitJoin">가입</button>
        </div>


    </div>
</body>

</html>

<script>
    const app = Vue.createApp({
        data() {
            return {
                // 변수 - (key : value)
                stuNo: "",
                stuName: "",
                stuDept: "",
                stuGender: ""
            };
        },
        methods: {
            // 함수(메소드) - (key : function())
            fnTest: function () {
                const self = this;
                $.ajax({
                    url: "",
                    dataType: "json",
                    type: "GET",
                    data: {},
                    success: function (data) {

                    }
                });
            },
            submitJoin: function () {
                const self = this;



                $.ajax({
                    url: "http://localhost:3000/join",
                    dataType: "json",
                    type: "get",
                    data: {
                        stuNo: self.stuNo,
                        stuName : self.stuName,
                        stuDept: self.stuDept,
                        stuGender: self.stuGender
                    },
                    success: function (data) {
                        console.log(data);
                        alert("가입성공");
                        location.href = "login.html";

                    }
                });
            }
        }, // methods
        mounted() {
            // 처음 시작할 때 실행되는 부분
            const self = this;
        }
    });

    app.mount('#app');
</script>
