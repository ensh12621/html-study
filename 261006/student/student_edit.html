<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        table,
        tr,
        td,
        th {
            border: 1px solid black;
            padding: 5px 10px;
            border-collapse: collapse;
        }
    </style>
</head>

<body>
    <div id="app">
        <!-- html. 반드시 id가 app인 태그 안에서 작업 -->
        <!-- (script 맨 하단 app.mount('#app'); 여기 아이디와 같아야 함) -->

        <div>
            <label for="stu-no">학번: </label>
            <input type="text" id="stu-no" v-model="stuNo" disabled>
        </div>

        <div>
            <label for="stu-name">이름 </label>
            <input type="text" id="stu-name" v-model="stuName">
        </div>
        <div>
            <label for="dept">학과: </label>
            <input type="text" id="dept" v-model="dept">
        </div>
        <div>
            <button @click="fnEdit">수정</button>
        </div>

    </div>
</body>

</html>

<script>
    const app = Vue.createApp({
        data() {
            return {
                // 변수 - (key : value)
                stuNo: "",
                stuName: "",
                dept: ""
            };
        },
        methods: {
            fnLoadUserInfo: function () {
                const self = this;
                const queryParams = new URLSearchParams(window.location.search);
                self.stuNo = queryParams.get('stuNo') || '';

                $.ajax({
                    url: "http://localhost:3000/search",
                    dataType: "json",
                    type: "GET",
                    data: {
                        stuNo: self.stuNo
                    },
                    success: function (data) {
                        console.log(data);
                        self.stuNo = data.info.STU_NO;
                        self.stuName = data.info.STU_NAME;
                        self.dept = data.info.STU_DEPT;
                    }
                });

            },
            // 함수(메소드) - (key : function())
            fnEdit: function () {
                const self = this;

                const data = {
                    stuNo: self.stuNo,
                    stuName: self.stuName,
                    dept: self.dept
                };

                $.ajax({
                    url: "http://localhost:3000/update",
                    dataType: "json",
                    type: "GET",
                    data: data,
                    success: function (data) {
                        console.log("수정되었습니다.");
                        location.href = "student-list.html";
                    }
                });
            }
        }, // methods
        mounted() {
            // 처음 시작할 때 실행되는 부분
            const self = this;
            self.fnLoadUserInfo();
            
        }
    });

    app.mount('#app');
</script>
