<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        table,
        tr,
        td,
        th {
            border: 1px solid black;
            padding: 5px 10px;
            border-collapse: collapse;
        }
    </style>
</head>

<body>
    <div id="app">
        <!-- html. 반드시 id가 app인 태그 안에서 작업 -->
        <!-- (script 맨 하단 app.mount('#app'); 여기 아이디와 같아야 함) -->

        <div>
            <label for="stu-no">학번: </label>   
            <input type="text" id="stu-no" v-model="stuNo" :disabled="!isDuplicated" >
            <button @click="fnDupCheckId">중복체크</button>
        </div>
        
        <div>
            <label for="stu-name">이름 </label>   
            <input type="text" id="stu-name" v-model="stuName">
        </div>
        <div>
            <label for="dept">학과: </label>   
            <input type="text" id="dept" v-model="dept">
        </div>
        <div>
            <button :disabled="isDuplicated" id="add-btn" @click="fnAdd">추가</button>
        </div>

    </div>
</body>

</html>

<script>
    const app = Vue.createApp({
        data() {
            return {
                // 변수 - (key : value)
                stuNo:"",
                stuName: "",
                dept:"",
                isDuplicated: true
            };
        },
        methods: {
            // 함수(메소드) - (key : function())
            fnAdd: function () {
                const self = this;

                if(self.stuNo.length != 8){
                    alert("학번은 8글자입니다.");
                    return;
                }

                if(!/^[0-9]+$/.test(self.stuNo)){
                    alert("값을 숫자로만 입력해주세요");
                    return;
                }
                

                const data = {
                    stuNo: self.stuNo,
                    name: self.stuName,
                    dept: self.dept
                };

                $.ajax({
                    url: "http://localhost:3000/insert",
                    dataType: "json",
                    type: "GET",
                    data: data,
                    success: function (data) {
                        alert(data.result);
                    }
                });
            },fnDupCheckId: function (){
                
                const self = this;
                self.stuNo;

                $.ajax({
                    url: "http://localhost:3000/search",
                    dataType: "json",
                    type: "GET",
                    data: {
                        stuNo: self.stuNo
                    },
                    success: function (data) {
                        console.log(data.info == null);
                        if(data.info == null){
                            self.isDuplicated = false;
                            alert("사용가능한 학번입니다");
                        }else{
                            self.isDuplicated = true;
                            alert("중복된 학번입니다.");
                        }
                    }
                });
            },

        }, // methods
        
        mounted() {
            // 처음 시작할 때 실행되는 부분
            const self = this;
        }
    });

    app.mount('#app');
</script>
