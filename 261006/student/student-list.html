<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        table,
        tr,
        td,
        th {
            border: 1px solid black;
            padding: 5px 10px;
            border-collapse: collapse;
        }
    </style>
</head>

<body>
    <div id="app">
        <!-- html. 반드시 id가 app인 태그 안에서 작업 -->
        <!-- (script 맨 하단 app.mount('#app'); 여기 아이디와 같아야 함) -->

        <div style="margin: 20px 0; display:flex; gap:5px;" >
            <select name="" id="" v-model="grade" @change="fnTotalSearch">
                <option value="">:: 전체 ::</option>
                <option value="1">1학년</option>
                <option value="2">2학년</option>
                <option value="3">3학년</option>
                
            </select>
 
            <select name="" id="" v-model="dept" @change="fnTotalSearch">
                <option value="">:: 모든 학과 ::</option>
                <option value="기계">기계</option>
                <option value="전기전자">전기전자</option>
                <option value="컴퓨터정보">컴퓨터정보</option>

            </select>
        </div>

        <div style="margin-top:20px;">
            <label>
                검색어:
                <input type="text" v-model="keyword" @keyup.enter="fnTotalSearch">
            </label>
            <button @click="fnTotalSearch" >검색</button>
        </div>

        <div style="margin:10px 0; ">
            <label>
                <input type="radio" name="order" v-model="order" value="dept" @change="fnTotalSearch" >
                학과순:
            </label>

            <label>
                <input type="radio" name="order" v-model="order" value="name" @change="fnTotalSearch">
                이름순:
            </label>
            
            <label>
                <input type="radio" name="order" v-model="order" value="grade" @change="fnTotalSearch">
                학년순:
            </label>

        </div>

        <div>

            <table>
                <thead>
                    <tr>
                        <th>학번</th>
                        <th>이름</th>
                        <th>학과</th>
                        <th>학년</th>
                        <th>수정</th>
                        <th>삭제</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="item in list">
                        <td>{{item.STU_NO}}</td>
                        <td>
                            <a @click="fnView(item.STU_NO)" href="javascript:;">
                                {{item.STU_NAME}}
                            </a>
                        </td>
                        <td>{{item.STU_DEPT}}</td>
                        <td>{{item.STU_GRADE}}</td>
                        <td>
                            <button @click="fnEdit(item.STU_NO)">
                                수정
                            </button>
                        </td>
                        <td>
                            <button @click="fnRemove(item.STU_NO)">
                                삭제
                            </button>
                        </td>

                    </tr>

                </tbody>
            </table>
        </div>
        <div>
            <a href="student_add.html   ">
                <button>
                    학생추가
                </button>
            </a>

        </div>

    </div>
</body>

</html>

<script>
    const app = Vue.createApp({
        data() {
            return {
                // 변수 - (key : value)
                list: [],
                grade:"",
                dept: "",
                order:"dept",
                keyword:""
            };
        },
        methods: {
            // 함수(메소드) - (key : function())
            fnList: function () {
                const self = this;
                $.ajax({
                    url: "http://localhost:3000/list",
                    dataType: "json",
                    type: "GET",
                    data: {},
                    success: function (data) {
                        console.log(data.list);
                        self.list = data.list;
                    }
                });
            },
            fnRemove: function (stuNo) {
                if (!confirm("정말로 삭제하시겠습니까?")) {
                    return;
                }
                const self = this;
                $.ajax({
                    url: "http://localhost:3000/delete",
                    dataType: "json",
                    type: "GET",
                    data: { stuNo },
                    success: function (data) {
                        console.log(data);
                        alert("삭제되었습니다");
                        self.fnList();
                    }
                });
            }, fnEdit: function (stuNo) {
                location.href = `student_edit.html?stuNo=${stuNo}`;
            },

            fnView : function(stuNo){
                location.href = `student-view.html?stuNo=${stuNo}`;
            },

            fnChangeGrade: function(){

                const self = this;

                 $.ajax({
                    url: "http://localhost:3000/find-by-grade",
                    dataType: "json",
                    type: "GET",
                    data: { grade: self.grade },
                    success: function (data) {
                        console.log(data);
                        self.list = data;
                    }
                });
            },

            fnChangeDept: function(){
                
                const self = this;



                 $.ajax({
                    url: "http://localhost:3000/find-by-dept",
                    dataType: "json",
                    type: "GET",
                    data: { dept: self.dept },
                    success: function (data) {
                        console.log(data);
                        self.list = data;
                    }
                });
            },

            fnTotalSearch: function(){
                 const self = this;

                 $.ajax({
                    url: "http://localhost:3000/total-search2",
                    dataType: "json",
                    type: "GET",
                    data: { 
                        dept: self.dept, 
                        grade : self.grade ,
                        order: self.order,
                        keyword: self.keyword
                    },
                    success: function (data) {
                        //console.log(data);
                        self.list = data;
                    }
                });
            }


        }, // methods
        mounted() {
            // 처음 시작할 때 실행되는 부분
            const self = this;
            self.fnList();
        }
    });

    app.mount('#app');
</script>
