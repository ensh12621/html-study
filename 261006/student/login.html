<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        table,
        tr,
        td,
        th {
            border: 1px solid black;
            padding: 5px 10px;
            border-collapse: collapse;
        }
    </style>
</head>

<body>
    <div id="app">
        <!-- html. 반드시 id가 app인 태그 안에서 작업 -->
        <!-- (script 맨 하단 app.mount('#app'); 여기 아이디와 같아야 함) -->

        <div>
            <input type="text" v-model="stuNo" placeholder="학번 입력">
        </div>
        <div>
            <input type="text" v-model="stuName" placeholder="학생이름 입력">
        </div>

        <div>
            <button @click="fnLogin">로그인</button>
            <button @click="fnJoinForm">회원가입</button>
        </div>

    </div>
</body>

</html>

<script>
    const app = Vue.createApp({
        data() {
            return {
                // 변수 - (key : value)
                stuNo: "",
                stuName: ""
            };
        },
        methods: {
            // 함수(메소드) - (key : function())
            fnLogin: function () {
                const self = this;

                console.log(self.stuNo, self.stuName);

                $.ajax({
                    url: "http://localhost:3000/login",
                    dataType: "json",
                    type: "GET",
                    data: {
                        stuNo: self.stuNo,
                        stuName: self.stuName
                    },
                    success: function (data) {
                        if(data.result == "success"){
                            location.href = "student-list.html";
                        }else{
                            alert("로그인에 실패하였습니다.");
                        }
                    }
                });
            },
            fnJoinForm: function(){
                location.href = "join.html";
            }
        }, // methods
        mounted() {
            // 처음 시작할 때 실행되는 부분
            const self = this;
        }
    });

    app.mount('#app');
</script>
