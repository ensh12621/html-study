<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>


</head>
<body>
    <div id="app">
        <!-- html. 반드시 id가 app인 태그 안에서 작업 -->
        <!-- (script 맨 하단 app.mount('#app'); 여기 아이디와 같아야 함) -->

        <div>
            <label>
                숫자1:
                <input type="text" v-model="num1" />
            </label>
        </div>
        <div>
            <label>
                숫자2:
                <input type="text" v-model="num2" />
            </label>
            
        </div>
        <div>
            <button @click="sum">더하기</button>
            <button @click="clear">초기화</button>
        </div>
        <hr />
        <div>
            <p>{{result}}</p>
        </div>
    </div>
</body>
</html>

<script>
    const app = Vue.createApp({
        data() {
            return {
                // 변수 - (key : value)
                num1: "",
                num2: "",
                result: ""
            };
        },
        methods: {
            // 함수(메소드) - (key : function())
            fnTest: function () {
                let self = this;
                $.ajax({
                    url: "",
                    dataType: "json",
                    type: "GET",
                    data: {},
                    success: function (data) {

                    }
                });
            },
            sum: function(){
                let self = this;
                self.result = `결과: ${Number(self.num1) + Number(self.num2)}`;
            }, 
            clear: function(){
                let self = this;
                self.num1 = "";
                self.num2 = "";
                self.result = "";
            }
        }, // methods
        mounted() {
            // 처음 시작할 때 실행되는 부분
        }
    });

    app.mount('#app');
</script>
