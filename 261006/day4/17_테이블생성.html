<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        table, tr, td, th{
            border:1px solid black;
            border-collapse: collapse;
            text-align: center;
            padding:5px 10px;

        }

    </style>
</head>
<body>
    

    <div id="contents"></div>

    <div>
        <button onclick="fnCreateTable()">
            테이블 생성
        </button>
        <button onclick="fnCreate4x4Table()">4행4열 테이블 만들기</button>
    </div>

<script>

    function fnCreateTable(){
        // 1. 테이블 태그 생성 <table></table>
        // 2. tr 태그 생성 <tr></tr>
        // 3. td 태그 생성 <td></td>
        // 4. td태그를 tr태그에 넣기
        // 5. tr태그를 table 태그에 넣기

        const table = document.createElement("table");
        const tr = document.createElement("tr");
        const td1 = document.createElement("td");
        const td2 = document.createElement("td");

        td1.innerHTML = "1";
        td2.innerHTML = "2";

        tr.appendChild(td1);
        tr.appendChild(td2);
        table.appendChild(tr);
        
        document.querySelector("#contents").appendChild(table);
    }


    function fnCreate4x4Table(){
        
        const table = document.createElement("table");
        
        let cnt = 1;
        for(let i=0; i<4; i++){
            const tr = document.createElement("tr");
            
            for(let j=0; j<4; j++){
                console.log(cnt);
                const td = document.createElement("td");
                td.innerHTML = cnt;
                cnt++;

                tr.appendChild(td);
                
            }
            table.appendChild(tr);
        }

        document.querySelector("#contents").appendChild(table);
    }
</script>

</body>
</html>
