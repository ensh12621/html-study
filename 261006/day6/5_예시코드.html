<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        dialog{
            border: none;
            border-radius: 5px;
        }

        dialog::backdrop{
            background-color: rgba(0,0,0, 0.5);
            backdrop-filter: blur(3px);
        }

        details{
            cursor:pointer;
        }

    </style>
</head>
<body>

    <button id="open">
        다이얼로그 열기
    </button>
    
    <dialog id="my-dialog">
        <h3>다이얼로그</h3>
        <p>간단하게 다이얼로그 띄우기~~</p>
        <form action="" method="dialog">
            <button>닫기</button>
        </form>
    </dialog>



    <details>
        <summary>Q. HTML은 얼마나 재밌나요?</summary>
        <p>정말 재밌습니다(?)</p>
    </details>

    <hr />

    <picture>
        <source media="(max-width: 760px)" srcset="../images/superblacksoftcow3.png" />
        <source media="(max-width: 1024px)" srcset="../images/superblacksoftcow2.png" />
        <img src="../images/superblacksoftcow1.png" alt="이미지1" />
    </picture>


    <script>


        const dialog = document.querySelector("#my-dialog");
        const btn = document.querySelector("#open");

        btn.addEventListener("click", function(){
            dialog.showModal();
        });

    </script>

</body>
</html>
