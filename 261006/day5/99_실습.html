<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./99_실습.css">
</head>

<body>


    <div class="grid">
        <div class="header">
            <h1>헤더</h1>
            <a href="#" class="logo">
                NAVER
            </a>
            <div class="field">
                <input type="text">
                <button class="search-btn">검색</button>
            </div>
            <span>
                홍길동
            </span>
        </div><!-- header -->

        <div class="aside">
            <h1>카테고리</h1>
            <ul class="category">
                <li class="clicked">
                    <a href="#">전체상품</a>
                </li>

                <li>
                    <a href="#">스마트폰</a>
                </li>
                <li>
                    <a href="#">게임기</a>
                </li>
                <li>
                    <a href="#">노트북</a>
                </li>
                <li>
                    <a href="#">기타</a>
                </li>
            </ul>

            <h1>가격대</h1>
            <ul class="price-range">
                <li>
                    <label>
                        <input type="checkbox" name="" id="">
                        1만원 이하
                    </label>
                </li>
                <li>
                    <label>
                        <input type="checkbox" name="" id="">
                        1만원 ~ 3만원
                    </label>
                </li>
                <li>
                    <label>
                        <input type="checkbox" name="" id="">
                        3만원 ~ 5만원
                    </label>
                </li>
                <li>
                    <label>
                        <input type="checkbox" name="" id="">
                        5만원 이상
                    </label>
                </li>
            </ul>

        </div>

        <div class="content">
            <h1>메인 영역</h1>
            <ul class="card-list">
                <li>
                    <a href="#">
                        <img src="../images/superblacksoftcow2.png" alt="썸네일" height="150" />
                        <h2>갤럭시 S4</h2>
                        <span class="red">15,900원</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="../images/superblacksoftcow2.png" alt="썸네일" height="150" />
                        <h2>아이폰 15</h2>
                        <span class="red">39,000원</span>
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="../images/superblacksoftcow2.png" alt="썸네일" height="150" />
                        <h2>LG OLED TV</h2>
                        <span class="red">28,500원</span>
                    </a>
                </li>

                <li>
                    <a href="#">
                        <img src="../images/superblacksoftcow2.png" alt="썸네일" height="150" />
                        <h2>맥북 에어 M3</h2>
                        <span class="red">45,500원</span>
                    </a>
                </li>

                <li>
                    <a href="#">
                        <img src="../images/superblacksoftcow2.png" alt="썸네일" height="150" />
                        <h2>갤럭시 북4</h2>
                        <span class="red">19,000원</span>
                    </a>
                </li>



            </ul>
        </div>

    </div>

</body>

</html>
