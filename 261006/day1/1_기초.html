<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    Hello HTML!!!
    <!-- pre 태그 : 작성한 그대로 출력 -->
    <!-- 사용을 권장하지 않음 -->
    <pre>
        Hello           HTML
        데빌헌터            로스트아크 개꿀잼
    </pre>
    
    <hr />

    <!-- h1 ~ h6 : 타이틀에 많이 쓰는 태그  -->
    <!-- 숫자에 따라 크기가 다르고 기본 볼드체(굵은체) -->
    <h1>h1 태그</h1>
    <h2>h2 태그</h2>
    <h3>h3 태그</h3>
    <h4>h4 태그</h4>
    <h5>h5 태그</h5>
    <h6>h6 태그</h6>

    <hr />

    <!-- div, span -->
    <!-- div: 한 줄을 다 차지하는 태그(block 속성), p 태그와 유사 -->
    <!-- span: 자신이 사용하는 만큼만 차지하는 태그(inline 속성) -->

    <span>html !!!</span>
    <span>재밌다 !!!</span>

    <div>html !!!</div>
    <div>재밌다 <b>!!!</b></div>

    <hr />

    <!-- b, strong : 텍스트를 굵게 -->
    <div>
        <b>b태그!!!</b>
    </div>
    <div>
        <strong>strong 태그!!!</strong>
    </div>

    <hr />


    <!-- i, em: 이태릭 체 -->
    <div>
        <i>i태그 !!!</i>
    </div>
    
    <div>
        <em>em 태그 !!!</em>
    </div>

    <hr />

    <!-- mark: 강조, 색상이 정해져있고, 나중에 css로 대체 가능 -->
    <div>
        <mark>mark 태그!</mark>
    </div>

    <hr />

    <!-- small : 작게, css로 세분화 가능 -->
    <div>
        <small>small 태그 !!</small>
    </div>

    <div>

        <span style="font-size:30px;">css로 글씨 크기 적용 !</span>
    </div>

    <hr />

    <div>
        HTML <sup>재밌다!</sup>
    </div>
    
    <div>
        HTML <sub>재밌다!</sub>
    </div>
    
    <div>
        HTML <del>재밌다!</del>
    </div>
    
    <br />
    <br />
    <br />

    <div>
        HTML <ins>재밌다!</ins>
    </div>
    




















    <div style="marigin-bottom : 500px;">

    </div>

    
</body>
</html>
