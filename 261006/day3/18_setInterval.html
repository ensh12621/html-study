<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div id="result""></div>

<script>
    let i = 1;
    const result = document.querySelector("#result")

    setInterval(function(){
        const html = result.innerHTML
        result.innerHTML = html +  " " + i;
        i++;
    }, 1000);

    setInterval(() => {
        i = 1;
        result.innerHTML = "";
    }, 10*1000);

</script>
    
</body>
</html>
