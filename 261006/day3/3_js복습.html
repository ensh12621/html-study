<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div>
        이름:
        <input type="text" id="user-name" />
        <button onclick="fnTest()">클릭!</button>
    </div>

    <div id="result"></div>



<script>


function fnTest(){
    const userName = document.querySelector("#user-name").value;
    document.querySelector("#result").innerHTML = `${userName}님 환영합니다!`;
    document.querySelector("#result").style.fontSize = "60px";
    document.querySelector("#result").style.color = "blue";
}


</script>
    
</body>
</html>
