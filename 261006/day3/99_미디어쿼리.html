<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .wrapper{
            width:80%;
            margin:0 auto;
            text-align: center;
        }

        .box{
            display:inline-block;
            width:500px;
            height:290px;
            border:1px solid black;
            margin-right:10px;
        }

        .box img{
            width:240px;
            height:290px
        }

        .box div{
            display:inline-block;
            height:100%;
            width:200px;
            line-height:100%;
            text-align: center;
            margin-left:25px;
        }

        .box h1{
            margin-top:50%;
            min-width:230px;
        }

        .box p{
            margin-top:3px;
        }

        .box h1, .box p{
            line-height: 1;
            padding:0;
            
        }
        
        .box > * {
            float:left;
        }

        @media screen and (max-width:760px){
             .box{
                width:30%;
                height:600px;
            }
        }

        @media screen and (max-width:1024px){
            .box{
                width:60%;
            }
        }

    </style>
</head>
<body>
    <div class="wrapper">

        

        <div class="box">
            <img src="../images/superblacksoftcow2.png" alt="이미지1">
            <div>
                <h1>아유... 하기 싫어</h1>
                <p>- 거성 박명수 -</p>
            </div>
        </div>

        <div class="box">
            <img src="../images//superblacksoftcow2.png" alt="이미지2">
            <div>
                <h1>그냥 놀고 싶다</h1>
                <p>- 거성 박명수 -</p>
            </div>
        </div>
    
    </div>
</body>
</html>
