<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 200px;
            height: 200px;
            border:2px solid black;
            background-image: url('../images/superblacksoftcow1.png');
            background-repeat: no-repeat;
            background-size: contain;
            background-position: center;
            border-radius: 50%;
            /* contain : 이미지가 잘리지 않게 최대한 비율을 유지하면서 크기를 맞춘다. */
            /* 박스가 이미지보다 클 경우 빈 공간이 생길 수 있다. */

            /* cover : 가로, 세로를 모두 채우는 게 목적 */
            /* 비율을 유지하고, 임지ㅣ가 잘릴 수 있다 */
            /* 빈 공간은 생기지 않는다. */

        }

        .box:hover{
            background-image: url("../images/superblacksoftcow2.png");
        }
    </style>
</head>
<body>

    <div class="box">

    </div>
    

</body>
</html>
